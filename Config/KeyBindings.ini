; Realistic Life Simulator - keyboard shortcuts.
; All actions are unassigned by default. Assign keys in game: Life Hub > Key bindings.
; По умолчанию ни одна клавиша не назначена. Назначить: Центр управления > Клавиши.
; An empty value means the action has no key. Key names follow System.Windows.Forms.Keys.

[KeyBindings]
OpenLifeHub=
OpenSettings=
OpenBank=
OpenPropertyMenu=
OpenVehicleMenu=
CallPolice=
RequestRoadsideAssistance=
StartJob=
PassengerMenu=
CallTaxi=
