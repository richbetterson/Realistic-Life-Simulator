; Realistic Life Simulator - general settings / общие настройки.
; Change these in game (Life Hub > Settings) or edit here while the game is closed.
; Меняйте в игре (Центр управления > Настройки) или здесь, когда игра закрыта.

[General]
; Auto | English | Russian
Language=Auto

[Performance]
; Low | Balanced | High
Profile=Low

[Saving]
; 1-60 minutes / минут
AutosaveMinutes=5

[Interface]
ShowLifeHubMapIcons=true
; Always | LowOnly | Off
FuelGauge=Always
ShowSpeedLimit=true

[Fuel]
Enabled=true
; Dollars per liter / долларов за литр
PricePerLiter=1.65
; 1.0 = a full tank lasts about 1-1.5 hours of driving / полный бак примерно на 1-1,5 часа езды
ConsumptionMultiplier=1.00
NpcRefuelling=true
LowFuelWarningPercent=15

[Traffic]
Enabled=true
; Witnessed = fine only when police see it / штраф только при свидетелях-полицейских
; Always = every detected violation is fined / штраф за каждое нарушение
; Off = record only / только запись в историю
FineMode=Witnessed
SpeedToleranceKmh=10
FineMultiplier=1.00
DetectSpeeding=true
DetectRedLights=true
DetectStopSigns=true
DetectWrongWay=true
DetectHeadlights=true
DetectFailureToYield=true

[Police]
; Police pull you over for witnessed violations / полиция останавливает за замеченные нарушения
TrafficStops=true
NpcTrafficStops=true

[Accidents]
Enabled=true
MinImpactSpeedKmh=12
OtherDriversCallEmergency=true

[NpcTraffic]
; Driver personalities and speed limits for NPCs / характеры водителей NPC и ограничения скорости
Enabled=true
Mistakes=true
YieldToEmergencyVehicles=true
Accidents=true

[Ownership]
; Minutes of play between bills / минут игры между счетами
BillingIntervalMinutes=60
VehicleWear=true
WearRate=1.00
; In-game km between services / км между ТО
ServiceIntervalKm=400
ShowPropertiesOnMap=true

[Passenger]
; Ask NPC drivers for a ride (Life Hub > Rides and taxi) / просить водителей NPC подвезти
Enabled=true

[Taxi]
Enabled=true
; Fare = BaseFare + PricePerKm x km driven + PricePerMinuteWaiting x minutes stopped in traffic (dollars)
; Тариф = посадка + цена за км x км + цена за минуту x минуты в пробке (доллары)
BaseFare=3.00
PricePerKm=2.20
PricePerMinuteWaiting=0.35

[Debug]
DebugLogging=false
